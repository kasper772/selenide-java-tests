name: Selenide tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1' # every Monday: catches changes on the demo site
  workflow_dispatch:

permissions:
  contents: read

env:
  REPORT_URL: https://kasper772.github.io/selenide-java-tests

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests (headless Chrome)
        id: tests
        continue-on-error: true # build the report first, fail the job at the end
        run: mvn -B test -Dselenide.headless=true

      - name: Bring back report history (trend charts)
        if: ${{ !cancelled() }}
        run: |
          # allure-maven reads history from .allure/history, plain Allure from allure-results/history
          mkdir -p target/allure-results/history .allure/history/report/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$REPORT_URL/history/$f" -o "target/allure-results/history/$f" || continue
            cp "target/allure-results/history/$f" ".allure/history/report/history/$f"
          done

      - name: Describe the environment and the CI run
        if: ${{ !cancelled() }}
        run: |
          cat > target/allure-results/environment.properties <<PROPS
          Browser=Chrome (headless)
          Java=$(java -version 2>&1 | head -1)
          OS=${{ runner.os }} $(lsb_release -rs)
          Site=https://the-internet.herokuapp.com
          PROPS
          cat > target/allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github", "buildName": "Run #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "$REPORT_URL"}
          JSON

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: mvn -B allure:report

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: target/allure-report

      - name: Fail the job if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1

  report:
    # Publishes the Allure report to GitHub Pages, also when tests fail.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
